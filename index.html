<!DOCTYPE html>
<html>
<head>
    <title>Membership Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .payment {
            background: #f2f2f2;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>MEMBERSHIP REGISTRATION</h1>

    <p><strong>Registration Fee: KSh 500</strong></p>

    <div class="payment">
        <h3>Payment Instructions</h3>

        <p>1. Go to M-Pesa on your phone.</p>
<p>2. Pay <strong>KSh 500</strong> to:</p>

<p>3. Send the money to M-Pesa number: <strong>0714487222</strong></p>

<p>4. After making the payment, enter the M-Pesa transaction code below.</p>
        

        

    <form action="/submit-payment" method="POST">

        <label>Full Name:</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label>M-Pesa Phone Number:</label>
        <input
            type="tel"
            name="phone"
            placeholder="07XXXXXXXX"
            required
        >

        <label>M-Pesa Transaction Code:</label>
        <input
            type="text"
            name="transactionCode"
            placeholder="Enter transaction code"
            required
        >

        <button type="submit">
            SUBMIT PAYMENT
        </button>

    </form>

</body>
</html>
